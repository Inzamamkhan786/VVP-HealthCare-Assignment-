# ============================================================
# Payment Ledger Service — Application Configuration
# ============================================================

# ----- DataSource (H2 In-Memory) ----------------------------
spring.datasource.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----- JPA / Hibernate --------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Transaction timeout (seconds) — guards against lock starvation
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# ----- H2 Console (dev only) --------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- Logging ----------------------------------------------
logging.level.com.vvh.ledger=DEBUG
logging.level.org.springframework.transaction=DEBUG
